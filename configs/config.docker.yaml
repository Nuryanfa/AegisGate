server:
  environment: production
  address: ":8080"
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

routes:
  - id: users
    path_prefix: /api/users
    upstream: http://users-upstream:8081
    timeout: 5s

  - id: orders
    path_prefix: /api/orders
    upstream: http://orders-upstream:8081
    timeout: 8s
