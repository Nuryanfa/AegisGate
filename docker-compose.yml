services:
  control-plane:
    profiles: ["control-plane-demo"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: control-plane
    environment:
      AEGIS_CONTROL_PLANE_CONFIG_PATH: /etc/aegisgate/control-plane.yaml
    volumes:
      - ./configs/control-plane.example.yaml:/etc/aegisgate/control-plane.yaml:ro
      - ./configs/snapshots/example.yaml:/etc/aegisgate/snapshot.yaml:ro
    expose:
      - "8443"
      - "9092"
    stop_grace_period: 10s
    init: true

  gateway-cp-a:
    profiles: ["control-plane-demo"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_CONTROL_PLANE_INSTANCE_ID: gateway-a
    volumes:
      - ./configs/config.control-plane-demo.yaml:/etc/aegisgate/config.yaml:ro
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      - control-plane
      - users-upstream
      - orders-upstream
    stop_grace_period: 20s
    init: true

  gateway-cp-b:
    profiles: ["control-plane-demo"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_CONTROL_PLANE_INSTANCE_ID: gateway-b
    volumes:
      - ./configs/config.control-plane-demo.yaml:/etc/aegisgate/config.yaml:ro
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      - control-plane
      - users-upstream
      - orders-upstream
    stop_grace_period: 20s
    init: true

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
      args:
        VERSION: ${AEGIS_BUILD_VERSION:-dev}
        COMMIT: ${AEGIS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${AEGIS_BUILD_TIME:-unknown}
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_REDIS_USERNAME: ${AEGIS_REDIS_USERNAME:-}
      AEGIS_REDIS_PASSWORD: ${AEGIS_REDIS_PASSWORD:-}
    volumes:
      - ${AEGIS_CONFIG_FILE:-./configs/config.docker.yaml}:/etc/aegisgate/config.yaml:ro
    ports:
      - "${AEGIS_GATEWAY_PORT:-8080}:8080"
    depends_on:
      users-upstream:
        condition: service_started
      orders-upstream:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    init: true

  gateway-secondary:
    profiles: ["distributed-demo"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
      args:
        VERSION: ${AEGIS_BUILD_VERSION:-dev}
        COMMIT: ${AEGIS_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${AEGIS_BUILD_TIME:-unknown}
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_REDIS_USERNAME: ${AEGIS_REDIS_USERNAME:-}
      AEGIS_REDIS_PASSWORD: ${AEGIS_REDIS_PASSWORD:-}
    volumes:
      - ${AEGIS_CONFIG_FILE:-./configs/config.docker.yaml}:/etc/aegisgate/config.yaml:ro
    ports:
      - "8083:8080"
    depends_on:
      users-upstream:
        condition: service_started
      orders-upstream:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    init: true

  users-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: users-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true

  orders-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: orders-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.3
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deployments/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - gateway

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployments/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
