services:
  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
    volumes:
      - ./configs/config.docker.yaml:/etc/aegisgate/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - users-upstream
      - orders-upstream
    init: true

  users-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: users-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true

  orders-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: orders-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true
