name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AEGIS_REDIS_INTEGRATION_ADDR: 127.0.0.1:6379

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install protobuf tooling
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.59.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Check protobuf schema and generated code
        run: |
          buf lint
          buf generate
          git diff --exit-code -- api/controlplane/v1

      - name: Check protobuf compatibility when baseline exists
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo 'No protobuf baseline on main yet; breaking check deferred.'
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Bounded fuzz smoke tests
        run: |
          go test ./internal/waf -run=^$ -fuzz=FuzzNormalizeQuery -fuzztime=2s
          go test ./internal/waf -run=^$ -fuzz=FuzzInspectJSON -fuzztime=2s
          go test ./internal/waf -run=^$ -fuzz=FuzzRuleEvaluation -fuzztime=2s

      - name: Build
        run: go build ./...

      - name: Build gateway and control-plane images
        run: |
          docker build --target gateway -f deployments/docker/Dockerfile .
          docker build --target control-plane -f deployments/docker/Dockerfile .
