services:
  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_REDIS_USERNAME: ${AEGIS_REDIS_USERNAME:-}
      AEGIS_REDIS_PASSWORD: ${AEGIS_REDIS_PASSWORD:-}
    volumes:
      - ${AEGIS_CONFIG_FILE:-./configs/config.docker.yaml}:/etc/aegisgate/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      users-upstream:
        condition: service_started
      orders-upstream:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    init: true

  gateway-secondary:
    profiles: ["distributed-demo"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_CONFIG_PATH: /etc/aegisgate/config.yaml
      AEGIS_REDIS_USERNAME: ${AEGIS_REDIS_USERNAME:-}
      AEGIS_REDIS_PASSWORD: ${AEGIS_REDIS_PASSWORD:-}
    volumes:
      - ${AEGIS_CONFIG_FILE:-./configs/config.docker.yaml}:/etc/aegisgate/config.yaml:ro
    ports:
      - "8083:8080"
    depends_on:
      users-upstream:
        condition: service_started
      orders-upstream:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    init: true

  users-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: users-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true

  orders-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    environment:
      EXAMPLE_SERVICE_NAME: orders-upstream
      EXAMPLE_HTTP_ADDR: :8081
    expose:
      - "8081"
    init: true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
