services:
  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: gateway
    environment:
      AEGIS_ENV: production
      AEGIS_HTTP_ADDR: :8080
      AEGIS_READ_TIMEOUT: 10s
      AEGIS_WRITE_TIMEOUT: 15s
      AEGIS_IDLE_TIMEOUT: 60s
      AEGIS_SHUTDOWN_TIMEOUT: 10s
      AEGIS_UPSTREAM_URL: http://example-upstream:8081
    ports:
      - "8080:8080"
    depends_on:
      - example-upstream
    init: true

  example-upstream:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: example-upstream
    expose:
      - "8081"
    init: true
